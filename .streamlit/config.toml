# Dashboard theme (streamlit run software/dashboard/app.py)
# Based on the "shadcn" template from Streamlit's developing-with-streamlit skill:
# light, neutral zinc greys, Inter font. Data colours live in software/dashboard/palette.py.

[client]
toolbarMode = "minimal"   # hides the Deploy button during presentations

[theme]
base = "light"
primaryColor = "#18181B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAFA"
codeBackgroundColor = "#F4F4F5"
textColor = "#09090B"
linkColor = "#18181B"
borderColor = "#E4E4E7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "6px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
codeTextColor = "#18181B"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["32px", "22px", "18px", "16px", "14px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
paddingTop = "2.5rem"
# Clean (blue) and compensated (orange) first; neutrals after
chartCategoricalColors = ["#2a78d6", "#eb6834", "#71717A", "#A1A1AA", "#D4D4D8"]

grayColor = "#71717A"
blueColor = "#2a78d6"
greenColor = "#16A34A"
redColor = "#DC2626"
yellowColor = "#CA8A04"
orangeColor = "#eb6834"
violetColor = "#7C3AED"

dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#FAFAFA"

[theme.sidebar]
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F4F4F5"
codeBackgroundColor = "#E4E4E7"
textColor = "#09090B"
borderColor = "#E4E4E7"
primaryColor = "#18181B"
dataframeHeaderBackgroundColor = "#F4F4F5"
dataframeBorderColor = "#E4E4E7"
